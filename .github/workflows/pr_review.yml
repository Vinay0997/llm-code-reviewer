name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install openai httpx

      - name: Run AI Review on diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os, subprocess, httpx, json

          diff = subprocess.check_output(
              ["git", "diff", "origin/main...HEAD", "--unified=5"],
              text=True
          )[:8000]

          from openai import OpenAI
          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

          response = client.chat.completions.create(
              model="gpt-4o",
              messages=[{
                  "role": "system",
                  "content": "You are a senior code reviewer. Review the following git diff and provide concise, actionable feedback as markdown bullet points covering bugs, security, style, and performance."
              }, {
                  "role": "user",
                  "content": f"```diff\n{diff}\n```"
              }]
          )

          review_body = "## AI Code Review\n\n" + response.choices[0].message.content

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]

          httpx.post(
              f"https://api.github.com/repos/{repo}/issues/{pr}/comments",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json"},
              json={"body": review_body}
          )
          print("Review posted!")
          EOF
